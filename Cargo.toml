[package]
name = "vram-fieldtest"
version = "0.1.0"
edition = "2021"
description = "A bounded, repeatable GPU memory field test"
license = "MIT"

[[bin]]
name = "vram-fieldtest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
pollster = "0.3"
wgpu = "0.19"
bytemuck = "1.21"

[dev-dependencies]
tempfile = "3.12"
