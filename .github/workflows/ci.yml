name: clean build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean dependency install
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exact clean build command
        run: npm ci && npm test && npm run build
      - name: Rust formatting and strict lint
        run: npm run lint

  powershell-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise the PowerShell checksum guard with a good and tampered archive
        shell: pwsh
        run: |
          $output = & node --test --test-name-pattern '^regression: Windows PowerShell installer copies only a checksum-matching archive$' site/tests/claims.test.mjs 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $detail = (($output | Out-String).Trim() -replace "`r?`n", '%0A')
            Write-Host "::error title=PowerShell installer regression::$detail"
            exit $exitCode
          }
