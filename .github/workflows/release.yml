name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            archive: zip
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir stage
          cp target/${{ matrix.target }}/release/vram-fieldtest stage/
          tar -C stage -czf vram-fieldtest-${{ matrix.label }}.tar.gz vram-fieldtest
          shasum -a 256 vram-fieldtest-${{ matrix.label }}.tar.gz > vram-fieldtest-${{ matrix.label }}.sha256
      - name: Build macOS installer package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p pkgroot/usr/local/bin
          cp target/${{ matrix.target }}/release/vram-fieldtest pkgroot/usr/local/bin/
          pkgbuild --root pkgroot --identifier in.sociobot.vram-fieldtest --version "${GITHUB_REF_NAME#v}" vram-fieldtest-${{ matrix.label }}.pkg
          shasum -a 256 vram-fieldtest-${{ matrix.label }}.pkg > vram-fieldtest-${{ matrix.label }}.pkg.sha256
      - name: Build Linux deb and rpm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p debroot/DEBIAN debroot/usr/bin
          cp target/${{ matrix.target }}/release/vram-fieldtest debroot/usr/bin/
          printf 'Package: vram-fieldtest\nVersion: %s\nArchitecture: amd64\nMaintainer: Sociobot\nDescription: Bounded GPU memory pattern test\n' "$version" > debroot/DEBIAN/control
          dpkg-deb --build debroot "vram-fieldtest_${version}_amd64.deb"
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp target/${{ matrix.target }}/release/vram-fieldtest rpmbuild/SOURCES/
          printf 'Name: vram-fieldtest\nVersion: %s\nRelease: 1\nSummary: Bounded GPU memory pattern test\nLicense: MIT\nBuildArch: x86_64\n%%description\nBounded GPU memory pattern test.\n%%install\nmkdir -p %%{buildroot}/usr/bin\ninstall -m 755 %%{_sourcedir}/vram-fieldtest %%{buildroot}/usr/bin/vram-fieldtest\n%%files\n/usr/bin/vram-fieldtest\n' "$version" > rpmbuild/SPECS/vram-fieldtest.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/vram-fieldtest.spec
          cp rpmbuild/RPMS/x86_64/*.rpm .
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage
          Copy-Item target/${{ matrix.target }}/release/vram-fieldtest.exe stage/
          Compress-Archive -Path stage/vram-fieldtest.exe -DestinationPath vram-fieldtest-${{ matrix.label }}.zip
          (Get-FileHash vram-fieldtest-${{ matrix.label }}.zip -Algorithm SHA256).Hash.ToLower() + '  vram-fieldtest-${{ matrix.label }}.zip' | Set-Content vram-fieldtest-${{ matrix.label }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: vram-fieldtest-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Create checksums and manifest
        working-directory: release
        run: |
          find . -name '*.sha256' -exec cat {} \; > SHA256SUMS
          tag="${GITHUB_REF_NAME:-v0.1.0}"
          printf '{"version":"%s","assets":{"linux-x86_64":"https://github.com/B-Divyesh/sf-vram-fieldtest/releases/download/%s/vram-fieldtest-linux-x86_64.tar.gz","windows-x86_64":"https://github.com/B-Divyesh/sf-vram-fieldtest/releases/download/%s/vram-fieldtest-windows-x86_64.zip","macos-x86_64":"https://github.com/B-Divyesh/sf-vram-fieldtest/releases/download/%s/vram-fieldtest-macos-x86_64.tar.gz","macos-aarch64":"https://github.com/B-Divyesh/sf-vram-fieldtest/releases/download/%s/vram-fieldtest-macos-aarch64.tar.gz"}}\n' "$tag" "$tag" "$tag" "$tag" "$tag" > latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**
